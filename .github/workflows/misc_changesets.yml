name: 🔄 Changesets
on:
  workflow_call:
    outputs:
      publish:
        description: "Should publish"
        value: ${{ jobs.changesets.outputs.publish || 'false' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  changesets:
    name: 🔄 Changesets
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.should_publish.outputs.publish }}
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v6

      - name: 🛫 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🦕❌ Setup node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: 🛠️ Install dependencies
        run: |
          pnpm install

      # 版本号只由人改。CI 在这里只做一件事：拿 package.json 里的版本去比对远端 tag，
      # 没发过才放行 release。
      - name: ❓ Should publish
        id: should_publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]]; then
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi
