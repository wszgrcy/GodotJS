name: 🐧 Linux Builds
on:
  workflow_call:
    inputs:
      release:
        required: true
        type: boolean
      version:
        required: true
        type: string
      version_mm:
        required: true
        type: string
      version_ref:
        description: "Godot engine commit reference"
        required: true
        type: string

# Global Settings
env:
  # runner 镜像的版本标记，只用来拼缓存名。SCons 判断一个 .o 能不能复用时只看
  # 源码和编译命令，不看编译器版本；runner 镜像一升级（GCC 换了），旧编译器产的
  # .o 会被当成有效继续用。把镜像版本写进缓存名，换镜像时改这里，整批缓存自动重建。
  RUNNER_TAG: u24
  # Ideally we'd use dev_mode=yes. Unfortunately, v8 headers contain warnings. So we manually set some dev_mode options.
  SCONS_FLAGS: >-
    verbose=yes
    warnings=extra
    strict_checks=yes
    module_text_server_fb_enabled=yes
    "accesskit_sdk_path=${{ github.workspace }}/${{ inputs.version_mm == '4.5' && 'accesskit-c-0.17.0' || (inputs.version_mm == '4.6' && 'accesskit-c-0.18.0' || 'accesskit-c-0.22.3') }}"
    jsb_native_esm=yes
    skip_js_runtime=yes
#  ASAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/asan.txt
#  LSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/lsan.txt
#  TSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/tsan.txt
#  UBSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/ubsan.txt

jobs:
  build-linux:
    # V8 15 的静态库是用 GCC 13 的标准库编的（它用到 std::atomic_ref 这些 GCC 12+ 才有的东西），
    # 产物里引用了 std::ios_base_library_init()，这个符号只在 GLIBCXX_3.4.32（GCC 13）起提供。
    # ubuntu-22.04 的 libstdc++ 只到 3.4.30，链接时缺这个符号，所以跟到 24.04。
    # 代价：成品的 glibc 下限从 2.35 抬到 2.39。
    runs-on: ubuntu-24.04
    name: Linux (${{ matrix.target }}, ${{ matrix.engine }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [ v8 ]
        target: ${{ inputs.release && fromJSON('[ "editor","template_release","template_debug"]') || fromJSON('["editor"]') }}
    steps:
      - name: Checkout Godot
        uses: actions/checkout@v6
        with:
          repository: godotengine/godot
          ref: ${{ inputs.version_ref }}
          submodules: recursive

      - name: Checkout GodotJS
        uses: actions/checkout@v6
        with:
          path: ${{github.workspace}}/modules/GodotJS/
          lfs: true
          submodules: recursive

      - name: Setup Godot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libwayland-bin # TODO: Figure out somehow how to embed this one.
          if [ "${{ !inputs.release && matrix.target || '' }}" == "editor" ]; then
            sudo apt-get install mesa-vulkan-drivers
          fi

      # 原本这里是腾磁盘步骤（rm -rf /usr/local/lib/android），实测每个 job 要跑 1.4 分钟。
      # 普通构建（含恢复的缓存）总共只写 ~4 GB，runner 空间足够；真正吃磁盘的
      # ASan 构建仍保留该步骤。
      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-${{ env.RUNNER_TAG }}-${{ matrix.target }}-${{inputs.version}}-${{ matrix.engine }}
        continue-on-error: true

      - name: Download scripts/out
        uses: actions/download-artifact@v8
        with:
          name: scripts-out
          path: ${{github.workspace}}/modules/GodotJS/scripts/out

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built AccessKit v17 [4.5]
        if: inputs.version_mm == '4.5'
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: AccessKit/accesskit-c
          version: tags/0.17.0
          file: accesskit-c-0.17.0.zip
          target: accesskit-c-0.17.0/accesskit_c.zip

      - name: Extract pre-built AccessKit v17 [4.5]
        if: inputs.version_mm == '4.5'
        run: unzip -o accesskit-c-0.17.0/accesskit_c.zip

      - name: Download pre-built AccessKit v18 [4.6]
        if: inputs.version_mm == '4.6'
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: AccessKit/accesskit-c
          version: tags/0.18.0
          file: accesskit-c-0.18.0.zip
          target: accesskit-c-0.18.0/accesskit_c.zip

      - name: Extract pre-built AccessKit v18 [4.6]
        if: inputs.version_mm == '4.6'
        run: unzip -o accesskit-c-0.18.0/accesskit_c.zip

      - name: Download pre-built AccessKit 0.22.3 [4.7]
        if: inputs.version_mm == '4.7'
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.22.3
          file: accesskit-c-0.22.3.zip
          target: accesskit_c.zip

      - name: Extract pre-built AccessKit 0.22.3 [4.7]
        if: inputs.version_mm == '4.7'
        run: unzip -o accesskit_c.zip

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            ${{ matrix.target != 'editor' && 'debug_symbols=no' || '' }}
            ${{ !inputs.release && matrix.target == 'editor' && 'tests=yes' || '' }}
          platform: linuxbsd

      - name: Setup pnpm
        if: ${{ !inputs.release && matrix.target == 'editor' }}
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node.js
        if: ${{ !inputs.release && matrix.target == 'editor' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build tests/project
        if: ${{ !inputs.release && matrix.target == 'editor' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "${{ github.workspace }}/modules/GodotJS/tests/project" install --ignore-workspace
          GODOT="${{ github.workspace }}/bin/godot.linuxbsd.editor.x86_64" pnpm -C "${{ github.workspace }}/modules/GodotJS/tests/project" build

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-${{ env.RUNNER_TAG }}-${{ matrix.target }}-${{inputs.version}}-${{ matrix.engine }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: linux-${{ matrix.target }}-${{inputs.version}}-${{ matrix.engine }}

      - name: Unit tests
        if: ${{ !inputs.release && matrix.target == 'editor' }}
        shell: sh
        env:
          BIN: ./bin/godot.linuxbsd.editor.x86_64
        run: |
          ${{ env.BIN }} --version
          ${{ env.BIN }} --help
          ${{ env.BIN }} --headless --test --test-case="[jsb]*" --force-colors

  # Editor built with AddressSanitizer. It uploads no artifact, it only runs the
  # JS tests with the sanitizer on. The flags below were measured on a local
  # build of this tree:
  #
  # - dev_build=yes is required. Without it the editor is compiled at -O2 and
  #   tests/scene/test_text_edit.cpp alone takes more than 18 minutes.
  # - mold is required. The default bfd linker cannot link this binary (it fails
  #   with a relocation overflow), and upstream Godot also switches the linker
  #   for its sanitizer builds.
  # - use_ubsan=yes is left out on purpose. With it the link fails with
  #   "relocation R_X86_64_PC32 against __ubsan_vptr_type_cache out of range",
  #   because this build compiles tests/, which upstream sanitizer builds don't.
  # - accesskit is off: it needs a downloaded SDK and has nothing to do with the
  #   JS runtime under test.
  build-linux-asan:
    name: Linux (ASan, v8)
    # 与 build-linux 保持一致，理由见那里的 runs-on 说明
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Godot
        uses: actions/checkout@v6
        with:
          repository: godotengine/godot
          ref: ${{ inputs.version_ref }}
          submodules: recursive

      - name: Checkout GodotJS
        uses: actions/checkout@v6
        with:
          path: ${{github.workspace}}/modules/GodotJS/
          lfs: true
          submodules: recursive

      - name: Setup Godot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libwayland-bin mesa-vulkan-drivers

      - name: Free disk space on runner
        run: |
          echo "Disk usage before:" && df -h
          sudo rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      # 这份构建的编译参数（dev_build + use_asan）与普通 editor 构建完全不同，
      # 产物 .o 不能共用，所以单独一份缓存 key。没有缓存时它每次都要从零编 3000 多个
      # 文件（实测 31~34 分钟），是整个流水线里最慢的一个 job。
      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-${{ env.RUNNER_TAG }}-asan-${{inputs.version}}-v8
        continue-on-error: true

      - name: Download scripts/out
        uses: actions/download-artifact@v8
        with:
          name: scripts-out
          path: ${{github.workspace}}/modules/GodotJS/scripts/out

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            accesskit=no
            tests=yes
            dev_build=yes
            use_asan=yes
            linker=mold
            debug_symbols=no
          platform: linuxbsd
          target: editor

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-${{ env.RUNNER_TAG }}-asan-${{inputs.version}}-v8
        continue-on-error: true

      # The [jsb] test cases need the test project compiled: the helpers check
      # that .godot/GodotJS/test_01.js exists, and that file is produced by
      # pnpm build from test_01.ts. Without these steps the tests run but fail.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build tests/project
        shell: bash
        env:
          # Type generation starts the editor, and starting the editor pulls in
          # SDL/dbus and fontconfig. Both leak; LeakSanitizer would otherwise
          # fail this step over allocations we don't own. Leak checking stays on
          # for the test run below, which is the thing actually under test.
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          pnpm -C "${{ github.workspace }}/modules/GodotJS/tests/project" install --ignore-workspace
          GODOT="${{ github.workspace }}/bin/godot.linuxbsd.editor.dev.x86_64.san" pnpm -C "${{ github.workspace }}/modules/GodotJS/tests/project" build

      - name: Unit tests
        shell: bash
        env:
          BIN: ./bin/godot.linuxbsd.editor.dev.x86_64.san
          ASAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/asan.txt
        run: |
          if [ ! -x "${{ env.BIN }}" ]; then
            echo "ASan 构建产物不存在：${{ env.BIN }}"
            exit 1
          fi
          set +e
          output=$("${{ env.BIN }}" --headless --test --test-case="[jsb]*" --force-colors 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            echo "ASan 下单元测试失败，退出码 $code"
            exit 1
          fi
          # Without a doctest summary the tests never ran; don't report success.
          if ! printf '%s\n' "$output" | grep -q '\[doctest\]'; then
            echo "测试没有运行：输出里找不到 doctest 汇总"
            exit 1
          fi
          # "failed to intercept" lines mention AddressSanitizer too, so only the
          # real report headers count as a failure.
          if printf '%s\n' "$output" | grep -qE 'ERROR: (AddressSanitizer|LeakSanitizer)'; then
            echo "ASan 报告了内存问题，见上面的日志"
            exit 1
          fi
