name: 🧪 Runtime Matrix
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  runtime-matrix:
    strategy:
      fail-fast: false
      matrix:
        runtime: [host-v8, web-browser]
    # 跟 build_linux.yml 的镜像保持一致：产物是在那个镜像上编的，glibc 低于它跑不起来
    runs-on: ubuntu-24.04
    name: Runtime (${{ matrix.runtime }})
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ pnpm install
        uses: ./.github/actions/pnpm-install

      - name: 🛠️ pnpm build
        run: |
          pnpm build
        shell: bash

      - name: ⏬ Download host-v8 artifact
        if: matrix.runtime == 'host-v8' || matrix.runtime == 'web-browser'
        uses: actions/download-artifact@v8
        with:
          name: linux-editor-${{ inputs.version }}-v8
          path: runtime-artifacts/host-v8

      - name: ⏬ Download web-browser template artifact
        if: matrix.runtime == 'web-browser'
        uses: actions/download-artifact@v8
        with:
          name: web-template_debug-${{ inputs.version }}-browser
          path: runtime-artifacts/web-browser

      - name: 📦 Stage runtime assets for run-runtime-matrix
        shell: bash
        run: |
          set -euo pipefail
          fail_missing() {
            echo "::error::missing required runtime artifact for $1 (version ${{ inputs.version }})"
            exit 1
          }

          pick_one() {
            local dir="$1"
            local name_pattern="$2"
            local value
            value="$(find "$dir" -type f -name "$name_pattern" 2>/dev/null | head -n1 || true)"
            if [ -z "$value" ]; then
              return 1
            fi
            echo "$value"
          }

          mkdir -p tests/bin

          # 引擎启动时在自己旁边找 icudtl.dat（Intl.* 与 Date.prototype.toLocale* 要用），
          # staging 只拷二进制会把这份数据落下，所以拷二进制时一起拷过来。
          stage_icu_data() {
            local icu
            icu="$(pick_one "$1" 'icudtl.dat' || true)"
            if [ -n "$icu" ]; then
              cp "$icu" tests/bin/icudtl.dat
            fi
          }

          case "${{ matrix.runtime }}" in
            host-v8)
              src="$(pick_one runtime-artifacts/host-v8 'godot.linuxbsd.editor.*')" || fail_missing "host-v8 binary"
              cp "$src" tests/bin/godot-host-v8
              chmod +x tests/bin/godot-host-v8
              stage_icu_data runtime-artifacts/host-v8
              ;;
            web-browser)
              host_src="$(pick_one runtime-artifacts/host-v8 'godot.linuxbsd.editor.*')" || fail_missing "web-browser host-v8 binary"
              web_src="$(pick_one runtime-artifacts/web-browser '*.zip')" || fail_missing "web-browser template zip"
              cp "$host_src" tests/bin/godot-host-v8
              cp "$web_src" tests/bin/godot-web-browser-template_debug.zip
              chmod +x tests/bin/godot-host-v8
              stage_icu_data runtime-artifacts/host-v8
              ;;
          esac

      - name: 🛠️ Install tests/project dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C tests/project install --ignore-workspace

      - name: ▶️ Run selected runtime
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.runtime }}" in
            host-v8|web-browser) GODOT_BIN="${GITHUB_WORKSPACE}/tests/bin/godot-host-v8" ;;
          esac
          GODOT="$GODOT_BIN" pnpm test -- --runtimes ${{ matrix.runtime }} --skip-builds
