name: 🦅 Release
on:
  workflow_call:
    inputs:
      versions:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 🦅 Release
    runs-on: ubuntu-latest
    steps:
      - name: ⏬ Checkout repo
        uses: actions/checkout@v6

      - name: 🛫 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🦕❌ Setup node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: "pnpm"

      - name: 🛠️ Install dependencies
        run: pnpm install

      - name: 🔢 Names
        id: names
        run: |
          echo "tag=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "artifact=*-${{ inputs.versions }}-*" >> $GITHUB_OUTPUT

      - name: 📝 Release notes
        run: pnpm ci:publish ${{ inputs.versions }}

      - name: ⏬ Download all builds
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ steps.names.outputs.artifact }}
          path: dist

      - name: 📦 Pack each build as zip
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            ( cd "$name" && zip -qr "../$name.zip" . )
            rm -rf "$name"
          done
          ls -lh

      - name: 🚢 Publish release with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || steps.names.outputs.tag }}
          name: ${{ steps.names.outputs.tag }}
          target_commitish: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*.zip
          overwrite_files: true
