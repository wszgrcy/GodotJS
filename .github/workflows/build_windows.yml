name: 🏁 Windows Builds
on:
  workflow_call:
    inputs:
      release:
        required: true
        type: boolean
      version:
        required: true
        type: string
      version_mm:
        required: true
        type: string
      version_ref:
        description: "Godot engine commit reference"
        required: true
        type: string

# Global Settings
# SCONS_CACHE for windows must be set in the build environment
env:
  # Ideally we'd use dev_mode=yes. Unfortunately, v8 headers contain warnings. So we manually set some dev_mode options.
  SCONS_FLAGS: >-
    verbose=yes
    warnings=extra
    strict_checks=yes
    module_text_server_fb_enabled=yes
    debug_symbols=no
    d3d12=yes
    "angle_libs=${{ github.workspace }}/"
    "accesskit_sdk_path=${{ github.workspace }}/${{ inputs.version_mm == '4.5' && 'accesskit-c-0.17.0' || (inputs.version_mm == '4.6' && 'accesskit-c-0.18.0' || 'accesskit-c-0.22.3') }}"
    skip_js_runtime=yes
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8

jobs:
  build-windows:
    # Windows 10 with latest image
    runs-on: windows-latest
    name: Windows (${{ matrix.target }}, ${{ matrix.engine }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [v8, qjs-ng]
        target: ${{ inputs.release && fromJSON('["editor","template_release","template_debug"]') || fromJSON('["editor"]') }}
    steps:
      - name: Checkout Godot
        uses: actions/checkout@v6
        with:
          repository: godotengine/godot
          ref: ${{ inputs.version_ref }}
          submodules: recursive

      - name: Checkout GodotJS
        uses: actions/checkout@v6
        with:
          path: ${{github.workspace}}/modules/GodotJS/
          lfs: true
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: windows-${{ matrix.target }}-${{inputs.version}}-${{ matrix.engine }}
        continue-on-error: true

      - name: Download scripts/out
        uses: actions/download-artifact@v8
        with:
          name: scripts-out
          path: ${{github.workspace}}/modules/GodotJS/scripts/out

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download pre-built AccessKit v17 [4.5]
        if: inputs.version_mm == '4.5'
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: AccessKit/accesskit-c
          version: tags/0.17.0
          file: accesskit-c-0.17.0.zip
          target: accesskit-c-0.17.0/accesskit_c.zip

      - name: Extract pre-built AccessKit v17 [4.5]
        if: inputs.version_mm == '4.5'
        run: unzip -o accesskit-c-0.17.0/accesskit_c.zip

      - name: Download pre-built AccessKit v18 [4.6]
        if: inputs.version_mm == '4.6'
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: AccessKit/accesskit-c
          version: tags/0.18.0
          file: accesskit-c-0.18.0.zip
          target: accesskit-c-0.18.0/accesskit_c.zip

      - name: Extract pre-built AccessKit v18 [4.6]
        if: inputs.version_mm == '4.6'
        run: unzip -o accesskit-c-0.18.0/accesskit_c.zip

      - name: Download pre-built AccessKit 0.22.3 [4.7]
        if: inputs.version_mm == '4.7'
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.22.3
          file: accesskit-c-0.22.3.zip
          target: accesskit_c.zip

      - name: Extract pre-built AccessKit 0.22.3 [4.7]
        if: inputs.version_mm == '4.7'
        run: unzip -o accesskit_c.zip

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            ${{ matrix.target == 'editor' && 'vsproj=yes vsproj_gen_only=no' || '' }}
            ${{ matrix.engine == 'qjs-ng' && 'use_quickjs_ng=yes' || '' }}
            ${{ !inputs.release && matrix.target == 'editor' && 'tests=yes' || '' }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: windows-${{ matrix.target }}-${{inputs.version}}-${{ matrix.engine }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force
          # The D3D12 SDK installer and the mesa libraries land in bin/build_deps.
          # They are build inputs and are not needed at runtime, so drop them -
          # upstream Godot does the same before uploading its artifacts.
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          # The Agility SDK DLLs are an optional override: when they are missing the
          # engine falls back to the D3D12 runtime that ships with Windows, which is
          # what official Godot packages do. Match that and save 9 MB.
          Remove-Item bin/D3D12Core.dll,bin/d3d12SDKLayers.dll -Force -ErrorAction SilentlyContinue

      - name: Setup pnpm
        if: ${{ !inputs.release && matrix.target == 'editor' }}
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node.js
        if: ${{ !inputs.release && matrix.target == 'editor' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build tests/project
        if: ${{ !inputs.release && matrix.target == 'editor' }}
        shell: pwsh
        run: |
          $env:GODOT = "${{ github.workspace }}/bin/godot.windows.editor.x86_64.exe"
          pnpm -C "${{ github.workspace }}/modules/GodotJS/tests/project" install --ignore-workspace
          pnpm -C "${{ github.workspace }}/modules/GodotJS/tests/project" build

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: windows-${{ matrix.target }}-${{inputs.version}}-${{ matrix.engine }}

      - name: Unit tests
        if: ${{ !inputs.release && matrix.target == 'editor' }}
        shell: pwsh
        env:
          # The editor is a GUI-subsystem program now, and a shell does not always
          # wait for one. The console wrapper is a console program: it forwards the
          # arguments, waits for the editor to exit and returns its exit code.
          BIN: ./bin/godot.windows.editor.x86_64_console.exe
        run: |
          if (-not (Test-Path "${{ env.BIN }}")) { Write-Error "没有生成 console 包装器：${{ env.BIN }}"; exit 1 }
          ${{ env.BIN }} --version
          ${{ env.BIN }} --help
          $output = & "${{ env.BIN }}" --headless --test --test-case="[jsb]*" --force-colors 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) { Write-Error "单元测试失败，退出码 $code"; exit 1 }
          # Without a doctest summary in the output the tests never ran; don't let
          # this step report success in that case.
          if (-not ($output -match "\[doctest\]")) { Write-Error "测试没有运行：输出里找不到 doctest 汇总"; exit 1 }

